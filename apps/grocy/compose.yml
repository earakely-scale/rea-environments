# Grocy 4.7.1 (linuxserver image, sqlite in /config/data) for the rea showcase capture. Loopback only; compose project rea-grocy.
services:
  grocy:
    image: lscr.io/linuxserver/grocy:v4.7.1-ls345
    restart: unless-stopped
    ports:
      - "127.0.0.1:3222:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      GROCY_CURRENCY: EUR
    volumes:
      - grocy-config:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:80/login"]
      interval: 5s
      timeout: 5s
      retries: 48
volumes:
  grocy-config: {}
