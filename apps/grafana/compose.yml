# Grafana for the rea showcase capture. Loopback-only port, throwaway admin from ./.admin (600, never committed).
name: rea-grafana
services:
  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3101:3000"
    environment:
      GF_SECURITY_ADMIN_USER: rea-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?export from .admin (see up.sh)}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3101/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
volumes:
  grafana-data: {}
