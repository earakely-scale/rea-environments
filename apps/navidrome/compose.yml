# Navidrome 0.64.2 (sqlite) for the rea showcase capture. Loopback only; one compose project: rea-navidrome.
# The music library is generated by seed.py (silent MP3s with ID3 tags) into ./music before the first start and
# mounted read-only. External services, the insights collector and update checks are off.
services:
  navidrome:
    image: deluan/navidrome:0.64.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3233:4533"
    environment:
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
      ND_LOGLEVEL: info
      ND_SCANNER_SCANONSTARTUP: "true"
      ND_SCANNER_SCHEDULE: "0"
      ND_ENABLESHARING: "true"
      ND_ENABLEINSIGHTSCOLLECTOR: "false"
      ND_ENABLEEXTERNALSERVICES: "false"
      ND_LASTFM_ENABLED: "false"
      ND_LISTENBRAINZ_ENABLED: "false"
      ND_DEEZER_ENABLED: "false"
      ND_ENABLESTARRATING: "true"
      ND_DEFAULTTHEME: Light
    volumes:
      - nd-data:/data
      - ./music:/music:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4533/ping"]
      interval: 5s
      timeout: 5s
      retries: 36
volumes:
  nd-data: {}
