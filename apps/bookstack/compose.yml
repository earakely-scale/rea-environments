# BookStack (linuxserver image) + MariaDB for the rea showcase capture. Loopback only; one compose project: rea-bookstack.
# Secrets (APP_KEY, DB passwords) come from ~/capture/bookstack/.admin (mode 600) via `--env-file .admin`; see up.sh.
services:
  db:
    image: mariadb:11.8.9
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${BOOKSTACK_DB_ROOT_PASSWORD:?run up.sh}
      MARIADB_DATABASE: bookstack
      MARIADB_USER: bookstack
      MARIADB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:?run up.sh}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 36
  bookstack:
    image: lscr.io/linuxserver/bookstack:v26.09.1-ls288
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3219:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      APP_URL: http://127.0.0.1:3219
      APP_KEY: ${BOOKSTACK_APP_KEY:?run up.sh}
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: bookstack
      DB_USERNAME: bookstack
      DB_PASSWORD: ${BOOKSTACK_DB_PASSWORD:?run up.sh}
      # No mail transport here; keep outbound mail on the log driver.
      MAIL_DRIVER: log
    volumes:
      - bookstack-config:/config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/login || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
volumes:
  db-data: {}
  bookstack-config: {}
