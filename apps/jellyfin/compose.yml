# Jellyfin 10.10.7 for the rea showcase capture. Loopback only; compose project rea-jellyfin.
# ./media holds tiny synthetic files generated by seed.py (silent WAV tracks, PNG pictures, two EPUBs), mounted read-only.
services:
  jellyfin:
    image: jellyfin/jellyfin:10.10.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:3224:8096"
    environment:
      JELLYFIN_PublishedServerUrl: http://127.0.0.1:3224
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      - ./media:/media:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy localhost -fsS http://localhost:8096/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 48
volumes:
  jellyfin-config: {}
  jellyfin-cache: {}
