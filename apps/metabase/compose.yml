# Metabase (embedded H2 application database, bundled Sample Database) for the rea showcase capture.
# Loopback only; one compose project: rea-metabase.
services:
  metabase:
    image: metabase/metabase:v0.64.2.8
    restart: unless-stopped
    ports:
      - "127.0.0.1:3201:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_SITE_URL: http://127.0.0.1:3201
      JAVA_OPTS: "-Xmx2g"
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      # No "Examples" collection: every collection, question and dashboard in this instance is seeded synthetic content.
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_SEND_EMAIL_ON_FIRST_LOGIN_FROM_NEW_DEVICE: "false"
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 60s
volumes:
  metabase-data: {}
