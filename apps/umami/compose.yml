# Umami 3.4 + PostgreSQL 17 for the rea showcase capture. Loopback only; one compose project: rea-umami.
# DATABASE_URL, POSTGRES_PASSWORD and APP_SECRET come from .admin (mode 600, written by `python3 seed.py init`).
services:
  db:
    image: postgres:17.9-alpine
    restart: unless-stopped
    env_file:
      - .admin
    environment:
      POSTGRES_USER: umami
      POSTGRES_DB: umami
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 30
  umami:
    image: ghcr.io/umami-software/umami:3.4.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3215:3000"
    env_file:
      - .admin
    environment:
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/heartbeat || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
volumes:
  pgdata: {}
