# Komga 1.29.1 (embedded sqlite) for the rea showcase capture. Loopback only; one compose project: rea-komga.
# The comic library is generated by make_library.py and mounted read-only; the admin is claimed by seed.py.
services:
  komga:
    image: gotson/komga:1.29.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3231:25600"
    environment:
      TZ: UTC
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    volumes:
      - komga-config:/config
      - ./library:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/25600' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 48
volumes:
  komga-config: {}
